<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Country Details</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1><img src="assets/world.png" alt="">Country Details</h1>

    <div id="details-container">
        <div id="details-header">
            <button id="back-btn">Back</button>
            <div>
                <h2 id="country-name"></h2>
                <p id="country-official-name"></p>
            </div>
        </div>

        <div id="details-content">
            <div id="flag-panel">
                <img id="country-flag" src="" alt="Country flag">
            </div>

            <div id="country-details">
                <p><strong>Region:</strong> <span id="country-region"></span></p>
                <p><strong>Subregion:</strong> <span id="country-subregion"></span></p>
                <p><strong>Capital:</strong> <span id="country-capital"></span></p>
                <p><strong>Population:</strong> <span id="country-population"></span></p>
                <p><strong>Currencies:</strong> <span id="country-currencies"></span></p>
                <p><strong>Languages:</strong> <span id="country-languages"></span></p>
            </div>
        </div>

        <p id="no-data-message" class="hidden">No country data found in the query string.</p>
    </div>

    <script src="detail.js"></script>
</body>
</html>
