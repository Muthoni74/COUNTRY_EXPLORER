<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Country Explorer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1><img src="assets/world.png" alt="">Country Explorer</h1>

    <div id="controls">
        <div class="control-group">
            <label for="search-input">Search by Country Name:</label>
            <input type="text" id="search-input" placeholder="Search by Country Name..." />
        </div>

        <div class="control-group">
            <label for="region-select">Select a Region:</label>
            <select id="region-select">
                <option value="all">All Regions</option>
            </select>
        </div>

        <div class="control-group">
            <label for="population-input">Search by Population:</label>
            <input type="number" id="population-input" value="0" min="0" max="1500000000" step="1000000" />
            <span class="hint">Max - 1.5 billion (1500000000)</span>
        </div>
    </div>

    <div id="country-cards-container"></div>

    <div id="show-more-container">
        <button id="show-more-btn">Show More</button>
    </div>

    <script src="data.js"></script>
    <script src="script.js"></script>

</body>
</html>
